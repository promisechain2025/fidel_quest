<!doctype html>
<html lang="ti"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>eGeez — ወኪላት / ወኪሎች</title>
<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;line-height:1.5}li{border:2px solid #ddd;border-radius:1rem;padding:.6rem;margin:.5rem 0;list-style:none}ul{padding:0}.en{color:#666;font-size:.9em}</style>
</head><body>
<h1>ወኪላት eGeez <br><span lang="am">የeGeez ወኪሎች</span><br><span class="en" lang="en">eGeez representatives</span></h1>
<p lang="ti">ካርድ ክፍሊት ኣብ ዘይሰርሓሉ ሃገራት፡ ካብ ወኪል ኮድ ዓዲግኩም ኣብ easygeez.com/app ክፈቱ።</p>
<p lang="am">የካርድ ክፍያ በማይሰራባቸው አገሮች፣ ከወኪል ኮድ ገዝተው በeasygeez.com/app ይክፈቱ።</p>
<ul id="reps"></ul>
<p id="empty" hidden><span lang="ti">ወኪላት ኣብ ቀረባ ክዝርዘሩ እዮም።</span><br><span lang="am">ወኪሎች በቅርቡ ይዘረዘራሉ።</span><br><span class="en" lang="en">Representatives will be listed here soon.</span></p>
<script>
// Live list from the rep-code server (reps the admin marked "Show on website");
// falls back to the static representatives.json. Test reps only with ?test=1.
var REP_API='__REPCODE_API__';
var showTest=/[?&]test=1/.test(location.search);
function load(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
(REP_API.indexOf('http')===0?load(REP_API+'/api/representatives').catch(function(){return load('representatives.json')}):load('representatives.json')).then(function(d){
var l=((d&&d.representatives)||[]).filter(function(r){return showTest||!r.test});var u=document.getElementById('reps');
if(!l.length){document.getElementById('empty').hidden=false;return}
l.forEach(function(r){var li=document.createElement('li');var b=document.createElement('b');b.textContent=r.name+(r.test?' (TEST)':'');li.appendChild(b);
var place=[r.city,r.country].filter(Boolean).join(', ');if(place){li.appendChild(document.createElement('br'));li.appendChild(document.createTextNode(place))}
function link(href,text){li.appendChild(document.createElement('br'));var a=document.createElement('a');a.href=href;a.textContent=text;a.rel='noopener';li.appendChild(a)}
if(r.phone)link('tel:'+r.phone.replace(/[^+0-9]/g,''),'☎ '+r.phone);
if(r.whatsapp)link('https://wa.me/'+r.whatsapp.replace(/[^0-9]/g,''),'WhatsApp '+r.whatsapp);
if(r.email)link('mailto:'+r.email,r.email);
if(r.telegram)link('https://t.me/'+String(r.telegram).replace(/^@/,''),'Telegram '+r.telegram);
u.appendChild(li)})
}).catch(function(){document.getElementById('empty').hidden=false})
</script></body></html>
