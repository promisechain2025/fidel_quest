<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: N; src: url('/fonts/nunito-var.woff2'); font-weight: 200 1000; }
@font-face { font-family: E; src: url('/fonts/noto-sans-ethiopic-900.woff2'); font-weight: 900; }
* { margin: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; font-family: N, sans-serif; color: #eae3d2;
  background: linear-gradient(160deg, #1b2233, #141a28); overflow: hidden; position: relative; }
.tibeb { position: absolute; left: 0; right: 0; height: 14px;
  background: repeating-linear-gradient(90deg, #2f7d46 0 16px, #e2c069 16px 32px, #b23b2e 32px 48px, #2f6fb0 48px 64px); opacity: .85; }
.wrap { padding: 90px 80px; display: flex; align-items: center; gap: 60px; height: 100%; }
.tile { display: inline-flex; align-items: center; justify-content: center; font-family: E;
  background: #ffcb33; color: #7c4f00; border: 4px solid #c68d12; border-radius: 26%;
  box-shadow: 0 10px 0 #c68d12; }
h1 { font-size: 84px; font-weight: 1000; line-height: 1.04; letter-spacing: -0.02em; }
h1 span { color: #e2c069; }
p { margin-top: 26px; font-size: 30px; color: #9aa2ba; font-weight: 700; max-width: 640px; line-height: 1.4; }
.brand { position: absolute; top: 44px; left: 80px; display: flex; gap: 16px; align-items: center;
  font-size: 34px; font-weight: 1000; }
.brand img { width: 56px; height: 56px; border-radius: 14px; }
.mark { position: absolute; right: -40px; bottom: -60px; font-family: E; font-size: 460px;
  color: #eae3d2; opacity: 0.05; }
.tiles { position: absolute; right: 90px; top: 130px; display: grid; grid-template-columns: repeat(2, 130px); gap: 22px; transform: rotate(6deg); }
</style></head><body>
<div class="tibeb" style="top:0"></div>
<div class="brand"><img src="/icon-192.png"> eGeez</div>
<div class="wrap"><div>
  <h1>Their language.<br>Their story.<br><span>Learned at home.</span></h1>
  <p>Amharic and Tigrinya for kids - play, stories, and teachers who guide from anywhere.</p>
</div></div>
<div class="tiles">
  <span class="tile" style="width:130px;height:130px;font-size:66px">ሀ</span>
  <span class="tile" style="width:130px;height:130px;font-size:66px">ለ</span>
  <span class="tile" style="width:130px;height:130px;font-size:66px">መ</span>
  <span class="tile" style="width:130px;height:130px;font-size:66px">ተ</span>
</div>
<div class="mark">ፊ</div>
<div class="tibeb" style="bottom:0"></div>
</body></html>
