<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script id="app-hash-forward">
      // App links (class invite, homework, result, challenge) belong to the
      // PWA at /app/. Links shared before that fix point at the site root
      // (https://easygeez.com/#assign=...). The hash never reaches the
      // server, so forward it here, before the marketing site renders.
      (function (l) {
        if (/^\/app(\/|$)/.test(l.pathname)) return
        if (/^#(class|assign|receipt|challenge)=/.test(l.hash)) l.replace('/app/' + l.hash)
      })(location)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>eGeez - the fidel app for families</title>
    <meta name="description" content="A joyful app that teaches children the fidel: all 231 letters, offline, with no ads and no child data. One-time $12.99." />
    <!-- 32px PNG, not the 63 kB icon.svg: this is a 16px tab icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b2233" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7edcf" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="eGeez" />
    <meta property="og:title" content="eGeez - the fidel app for families" />
    <meta property="og:description" content="A joyful app that teaches children the fidel: all 231 letters, offline, with no ads and no child data. One-time $12.99." />
    <meta property="og:image" content="https://easygeez.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/nunito-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The hero letter tiles are Ethiopic; without this the face is only
         discovered once the CSS parses, making it the slowest asset. -->
    <link rel="preload" href="/fonts/noto-sans-ethiopic-900.woff2" as="font" type="font/woff2" crossorigin />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"Organization","name":"eGeez","url":"https://easygeez.com","logo":"https://easygeez.com/icon-512.png"},
        {"@type":"WebSite","name":"eGeez","url":"https://easygeez.com"}
      ]}
    </script>
    <script>
      // Set theme before paint: saved choice wins, else system preference.
      try {
        var s = localStorage.getItem('egz.site.theme')
        var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) { /* default */ }
    </script>
      <noscript><style>.reveal{opacity:1;transform:none}</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
