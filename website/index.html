<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>eGeez — Learn Amharic and Tigrinya, guided from anywhere</title>
    <meta name="description" content="A learning home for Amharic and Tigrinya: the eGeez app for kids, tools for remote teachers, and resources for homeschooling families - wherever in the world they live." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b2233" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7edcf" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="eGeez" />
    <meta property="og:title" content="eGeez — Learn Amharic and Tigrinya, guided from anywhere" />
    <meta property="og:description" content="A joyful app that teaches kids the fidel, tools for remote teachers, and guidance for homeschooling families." />
    <meta property="og:image" content="https://egeez.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/nunito-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The hero letter tiles are Ethiopic; without this the face is only
         discovered once the CSS parses, making it the slowest asset. -->
    <link rel="preload" href="/fonts/noto-sans-ethiopic-900.woff2" as="font" type="font/woff2" crossorigin />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@graph":[
        {"@type":"Organization","name":"eGeez","url":"https://egeez.app","logo":"https://egeez.app/icon-512.png"},
        {"@type":"WebSite","name":"eGeez","url":"https://egeez.app"}
      ]}
    </script>
    <script>
      // Set theme before paint: saved choice wins, else system preference.
      try {
        var s = localStorage.getItem('egz.site.theme')
        var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) { /* default */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
