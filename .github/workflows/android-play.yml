name: Android -> Google Play (internal testing)

# On every push/merge to main that touches the app (and manually from the
# Actions tab), build the signed Android App Bundle for
# net.promisechain.fidelquest and upload it to Play's INTERNAL testing track.
# Promoting internal -> production stays a manual step in Play Console
# (see docs/deploy-android.md).
#
# Until the one-time setup in docs/deploy-android.md is done (upload key
# reset approved + the five secrets below), the workflow only prints a notice
# and skips; it never turns main red.
#
# Secrets (GitHub > Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of egeez-upload.jks (the Play upload key)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (upload)
#   ANDROID_KEY_PASSWORD       key password (same as the store password is fine)
#   PLAY_SERVICE_ACCOUNT_JSON  Google Cloud service account JSON key
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'android/**'
      - '.github/workflows/android-play.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to the Play internal track (untick to only build the signed .aab)'
        type: boolean
        default: true

permissions:
  contents: read

# 1.4 free-download build: per-package IAP (core_unlock, prayer_book,
# bundle_core_prayer). Rep codes stay web-only; native ignores them.
env:
  VITE_PACKAGES: '1'

concurrency:
  group: android-play
  cancel-in-progress: false

jobs:
  preflight:
    name: Check Play secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          [ -n "$KS" ]        || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ]   || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASS" ]  || missing="$missing ANDROID_KEY_PASSWORD"
          [ -n "$PLAY_JSON" ] || missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          if [ -n "$missing" ]; then
            echo "::notice title=Play upload skipped::Missing secret(s):$missing. See docs/deploy-android.md for the one-time setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-upload:
    name: Build signed AAB and upload to internal
    needs: preflight
    if: needs.preflight.outputs.ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the Play upload certificate (APP-STORE.md, Android signing).
      # The build fails if the bundle is signed with any other key.
      EXPECTED_UPLOAD_CERT_SHA256: '7F:83:6B:D6:42:76:FF:4F:05:9F:A9:08:1C:36:EF:92:91:D8:2B:41:19:25:91:DF:3C:DA:F8:C6:07:7A:EB:74'
      AAB: android/app/build/outputs/bundle/release/app-release.aab
    steps:
      # versionCode = 100 + run number of this workflow: strictly increasing
      # per run and far above the hand-uploaded codes (<= 8). versionName
      # stays whatever android/app/build.gradle says.
      - name: Compute versionCode
        run: echo "VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      # Capacitor 7 / AGP 8.7 need JDK 21.
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # Same store-compliance guard as ios/App/ci_scripts/ci_post_clone.sh:
      # eGeez is paid upfront and sells only kids-profile slots in-app.
      - name: In-app purchase guard (env)
        run: |
          for v in VITE_STORE_IAP VITE_MONETIZE; do
            if [ -n "${!v:-}" ]; then
              echo "::error::$v is set; eGeez sells only kids-profile slots in-app (no full_app). Remove it."
              exit 1
            fi
          done

          # 1.4 packages build: VITE_PACKAGES must be exactly 1 or unset.
          if [ -n "${VITE_PACKAGES:-}" ] && [ "${VITE_PACKAGES}" != "1" ]; then
            echo "::error::VITE_PACKAGES must be 1 or unset."
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npx vitest run

      - name: Web build + cap sync android
        run: |
          npm run build
          npx cap sync android

      - name: In-app purchase guard (bundle)
        run: |
          if grep -rqE "full_app|FULL_APP_ENTITLEMENT|buyFullApp" dist; then
            echo "::error::The built app references full_app; only kids-profile slots (profile_slot_N) may be sold in-app."
            exit 1
          fi
          grep -rq "profile_slot_" dist || { echo "::error::The built app has no profile_slot purchase."; exit 1; }
          grep -q "capgo-native-purchases" android/capacitor.settings.gradle \
            || { echo "::error::Play Billing plugin (@capgo/native-purchases) missing from android/capacitor.settings.gradle; run npx cap sync android."; exit 1; }

      - name: Decode upload keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          test -s "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        working-directory: android
        env:
          EGEEZ_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          EGEEZ_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EGEEZ_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EGEEZ_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease -PegeezVersionCode="$VERSION_CODE"

      # build.gradle silently builds UNSIGNED when signing is incomplete; Play
      # would reject that, so fail here with a clear message instead.
      - name: Verify bundle is signed with the upload key
        run: |
          test -f "$AAB" || { echo "::error::$AAB was not produced"; exit 1; }
          FP=$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          if [ -z "$FP" ]; then
            echo "::error::$AAB is not signed. Check the four ANDROID_* secrets."
            exit 1
          fi
          if [ "$FP" != "$EXPECTED_UPLOAD_CERT_SHA256" ]; then
            echo "::error::Bundle is signed with $FP, not the Play upload key $EXPECTED_UPLOAD_CERT_SHA256."
            exit 1
          fi
          VN=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' android/app/build.gradle)
          echo "Signed with the upload key. versionName $VN, versionCode $VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: egeez-android-aab-${{ github.run_number }}
          path: ${{ env.AAB }}
          retention-days: 30
          if-no-files-found: error

      - name: Check R8 mapping file
        run: test -s android/app/build/outputs/mapping/release/mapping.txt || { echo "::error::mapping.txt missing (R8 did not run)"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: egeez-android-mapping-${{ github.run_number }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Upload to Google Play (internal testing)
        if: github.event_name == 'push' || inputs.upload
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.promisechain.fidelquest
          releaseFiles: ${{ env.AAB }}
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed

      - name: Summary
        if: github.event_name == 'push' || inputs.upload
        run: echo "Uploaded versionCode $VERSION_CODE to the Play **internal** track. Promote it in Play Console > Test and release > Internal testing." >> "$GITHUB_STEP_SUMMARY"
